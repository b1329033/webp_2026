<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>HW4 - 景點觀光展覽資訊</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 30px; }
        .controls { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
        #searchInput { width: 300px; display: inline-block; margin-left: 20px; }
    </style>
</head>
<body class="container">

    <div class="d-flex align-items-center mb-3">
        <h1>景點觀光展覽資訊</h1>
        <input type="text" id="searchInput" class="form-control" placeholder="搜尋名稱..." onchange="handleSearch()">
    </div>
    
    <table id="csie" class="table table-striped table-hover">
        <thead>
            <tr class="table-success">
                <th>名稱</th>
                <th>地點</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <div class="controls">
        <button class="btn btn-outline-primary" onclick="changePage(-1)">上一頁</button>
        <span id="pageInfo">1 / 1 頁</span>
        <button class="btn btn-outline-primary" onclick="changePage(1)">下一頁</button>
    </div>

    <script>
        let allData = [];      // 原始所有資料
        let filteredData = []; // 搜尋後的資料
        let currentPage = 1;   // 目前頁碼
        const pageSize = 10;   // 每頁十筆資料

        // 1. Ajax 抓取資料
        const openUrl = "https://cloud.culture.tw/frontsite/trans/SearchShowAction.do?method=doFindTypeJ&category=6";
        const xhr = new XMLHttpRequest();
        xhr.open('GET', openUrl, true);
        xhr.send();
        xhr.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                allData = JSON.parse(this.responseText);
                filteredData = allData; // 一開始過濾資料等於所有資料
                renderTable();
            }
        };

        // 2. 渲染表格邏輯
        function renderTable() {
            const tableBody = document.getElementById("tableBody");
            tableBody.innerHTML = ""; // 清空舊資料

            // 計算分頁範圍
            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = filteredData.slice(start, end); // 只抓出該頁的10筆

            // 顯示資料
            pageData.forEach(data => {
                const row = tableBody.insertRow();
                row.insertCell(0).innerText = data.title;
                const location = (data.showInfo && data.showInfo[0]) ? data.showInfo[0].location : "無資訊";
                row.insertCell(1).innerText = location;
            });

            // 更新分頁文字
            document.getElementById("pageInfo").innerText = `${currentPage} / ${totalPages} 頁`;
        }

        // 3. 分頁按鈕控制
        function changePage(step) {
            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            const newPage = currentPage + step;
            
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderTable();
            }
        }

        // 4. 搜尋功能
        function handleSearch() {
            const keyword = document.getElementById("searchInput").value.toLowerCase();
            
            // 根據名稱 (title) 進行過濾
            filteredData = allData.filter(item => {
                return item.title.toLowerCase().includes(keyword);
            });

            currentPage = 1; // 搜尋後回到第一頁
            renderTable();   // 重新計算分頁與呈現
        }
    </script>
</body>
</html>
